name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build KeyboardLanguageGuard.sln --configuration Release

      - name: Run tests
        run: dotnet test KeyboardLanguageGuard.sln --configuration Release --no-build --verbosity normal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Package installer
        run: powershell -ExecutionPolicy Bypass -File scripts/package-installer.ps1

      - name: Collect release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $notesFile = "RELEASE_NOTES_v$version.md"
          if (Test-Path $notesFile) {
            "notes_file=$notesFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "notes_file=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: KeyFix ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            artifacts/installer/KeyFixSetup-*.exe
            artifacts/installer/KeyFixSetup-*.exe.sha256
