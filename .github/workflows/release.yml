name: release

# Cuts the release from a tag: builds and tests on a clean runner, compiles the
# installer, records what went into it, and has GitHub attest that this exact
# file came out of this exact commit.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # create the release
  id-token: write      # sign the provenance statement
  attestations: write  # record it against this repository

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # The version is declared in three hand-edited places. A tag that
      # disagrees with any of them produces an installer whose filename, About
      # dialog and checksum do not all describe the same build, so stop here
      # rather than publish the mismatch.
      - name: Verify tag matches the declared version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          $files = [ordered]@{
            "src/KeyboardLanguageGuard.App/KeyboardLanguageGuard.App.csproj" = '<Version>([^<]+)</Version>'
            "src/KeyboardLanguageGuard.Core/KeyboardLanguageGuard.Core.csproj" = '<Version>([^<]+)</Version>'
            "installer/KeyboardLanguageGuard.iss" = '^\s*#define\s+MyAppVersion\s+"([^"]+)"'
          }

          foreach ($file in $files.Keys) {
            $match = Select-String -Path $file -Pattern $files[$file] | Select-Object -First 1
            if (-not $match) { throw "Could not read a version out of $file." }

            $declared = $match.Matches[0].Groups[1].Value
            if ($declared -ne $version) { throw "Tag is $version but $file says $declared." }
          }

          Write-Output "Releasing $version."
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build
        run: dotnet build KeyboardLanguageGuard.sln --configuration Release

      - name: Run tests
        run: dotnet test KeyboardLanguageGuard.sln --configuration Release --no-build --verbosity normal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Package installer
        run: powershell -ExecutionPolicy Bypass -File scripts/package-installer.ps1

      # What the installer is made of, in a format vulnerability scanners read.
      - name: Generate SBOM
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX KeyboardLanguageGuard.sln `
            --output artifacts/installer `
            --output-format Json `
            --filename "KeyFixSetup-${{ steps.version.outputs.version }}.cdx.json" `
            --exclude-test-projects `
            --set-name "KeyFix" `
            --set-version "${{ steps.version.outputs.version }}"

      # Lets anyone confirm the installer they downloaded was built here:
      #   gh attestation verify <installer> --repo ${{ github.repository }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/installer/KeyFixSetup-${{ steps.version.outputs.version }}.exe

      - name: Collect release notes
        id: notes
        shell: pwsh
        run: |
          $notesFile = "docs/release-notes/v${{ steps.version.outputs.version }}.md"
          if (Test-Path $notesFile) {
            "notes_file=$notesFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "notes_file=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: KeyFix ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            artifacts/installer/KeyFixSetup-*.exe
            artifacts/installer/KeyFixSetup-*.exe.sha256
            artifacts/installer/*.cdx.json
