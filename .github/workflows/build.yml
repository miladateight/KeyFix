name: build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build KeyboardLanguageGuard.sln --configuration Release

      - name: Run tests
        run: dotnet test KeyboardLanguageGuard.sln --configuration Release --no-build --verbosity normal

      - name: Publish self-contained app
        run: dotnet publish src/KeyboardLanguageGuard.App/KeyboardLanguageGuard.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KeyFix-win-x64
          path: artifacts/publish
