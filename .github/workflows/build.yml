name: build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build KeyboardLanguageGuard.sln --configuration Release

      - name: Run tests
        run: dotnet test KeyboardLanguageGuard.sln --configuration Release --no-build --verbosity normal

      - name: Publish self-contained app
        run: dotnet publish src/KeyboardLanguageGuard.App/KeyboardLanguageGuard.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KeyFix-win-x64
          path: artifacts/publish
